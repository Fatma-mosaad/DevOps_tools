# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fast
  template:
    metadata:
      labels:
        app: fast
    spec:
      containers:
        - name: fast
          image: sidpalas/k8s-getting-started:0.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
