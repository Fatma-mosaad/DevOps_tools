services:
  app:
    image: ${APP_IMAGE}
    container_name: users-app
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    env_file:
      - .env
    volumes:
      - users-db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  users-db-data:

