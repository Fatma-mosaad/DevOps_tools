---
- name: Provision Docker and Docker Compose
  hosts: app_server
  become: true

  vars_files:
    - all.yml

  tasks:
    - name: Install Docker (works on any Linux distro)
      ansible.builtin.package:
        name: "{{ docker_package_map[ansible_facts['os_family']] }}"
        state: present

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add remote user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Ensure CLI plugins directory exists
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        mode: '0755'

    - name: Install Docker Compose plugin (skipped if already present)
      ansible.builtin.get_url:
        url: "{{ docker_compose_plugin_url }}"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: '0755'

    - name: Verify Docker is actually working
      ansible.builtin.command: docker info
      register: docker_check
      changed_when: false
